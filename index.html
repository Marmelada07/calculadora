html:<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="card">
        <div >
            <br>
            <h1 id="titulo">Minha Calculadora</h1>
        </div>
        <div id="input">
            <input type="number" placeholder="Primeiro Número">
            <input type="number" placeholder="Segundo Número">
        </div>
        <div id="botao">
            <input type="submit" value="+" id="somar">
             <input type="submit" value="-" id="subtrair">
              <input type="submit" value="x" id="multiplicar">
               <input type="submit" value="÷" id="dividir">
        </div>
        <div id="resultado">
            Resultado:
        </div>
    </div>
</body>
</html>
